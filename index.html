<!DOCTYPE html>

<body>

<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:"class",theme:{extend:{colors:{surface:"#141311","surface-bright":"#3b3936","surface-container-lowest":"#0f0e0c","surface-container-low":"#1d1b19","surface-container":"#211f1d","surface-container-high":"#2b2a27","surface-container-highest":"#363431","on-surface":"#e7e2dd","on-surface-variant":"#d4c4af",outline:"#9c8f7b","outline-variant":"#504535",primary:"#ffcc72","on-primary":"#422c00","primary-container":"#e9ae3b",secondary:"#e6c26c","on-secondary":"#3e2e00",tertiary:"#ffc6be","error-container":"#93000a","on-error-container":"#ffdad6",wa:"#25d366"},fontFamily:{anton:["Anton","Impact","sans-serif"],grot:["Space Grotesk","system-ui","sans-serif"]}}}}</script>
<style>
body{background:#050403;margin:0;font-family:'Space Grotesk',system-ui,sans-serif;color:#e7e2dd}
.msy{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400}
.msy.f{font-variation-settings:'FILL' 1,'wght' 400}
.ns::-webkit-scrollbar{display:none}.ns{scrollbar-width:none}
#app{position:relative;max-width:430px;margin:0 auto;height:100dvh;overflow:hidden;background:#141311;isolation:isolate}
@media(min-width:520px){body{background:#050403 radial-gradient(circle at 50% 0,#2a1f0c,#050403 60%);padding:24px 0}#app{height:880px;border-radius:44px;border:10px solid #17130f;box-shadow:0 30px 80px #000d,0 0 0 1px #2a2420 inset}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.gold-bar{background:linear-gradient(90deg,#ffcc72,#e9ae3b 60%,#e6c26c);box-shadow:0 8px 24px rgba(233,174,59,.35)}
.glass{background:rgba(29,24,18,.88);backdrop-filter:blur(16px);border-top:1px solid rgba(245,208,120,.25)}
.ember{background:radial-gradient(circle at 50% 20%,rgba(233,174,59,.18),transparent 70%)}
input,textarea{outline:0}input:focus,textarea:focus{border-color:#e9ae3b!important;box-shadow:0 0 10px rgba(233,174,59,.2)}
.press:active{transform:scale(.98)}
.toast{position:absolute;left:50%;bottom:150px;transform:translate(-50%,16px);background:#ffcc72;color:#422c00;padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;letter-spacing:.04em;opacity:0;transition:.25s;z-index:99;pointer-events:none;white-space:nowrap;text-transform:uppercase}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<div id="app"></div>

<script>
const IMG={logo:"img/logo.jpg",map:"img/mapa-burzaco.jpg",3:"img/bacon-bogs.jpg",4:"img/doble-cheese-hero.jpg",5:"img/duo-ny.jpg",6:"img/cheese-bogs.jpg",7:"img/muzza-gigante.jpg",8:"img/doble-cheese-home.jpg",10:"img/slice-mano.jpg",11:"img/olympus-triple.jpg",13:"img/pepperoni-gigante.jpg",15:"img/doble-cheese.jpg"};
const CATS=["Todos","Hamburguesas","Pizzas NY","Combos","Papas","Bebidas"];
const OPTS={b:[["Extra cheddar","Queso fundido extra líquido",1200,"layers"],["Extra medallón","Smash 120 g con costra de fuego",3000,"lunch_dining"],["Agregar papas rústicas","Papas triples fritas con sal marina",2500,"fastfood"],["Sin cebolla","Preferencias de cocción",0,"do_not_disturb_on"]],
 p:[["Doble muzza","Más queso, más estiramiento",2000,"layers"],["Borde relleno","Relleno de cheddar",2500,"donut_large"],["Aceitunas","Verdes descarozadas",800,"circle"],["Sin orégano","Preferencias",0,"do_not_disturb_on"]]};
const P=[
 {id:"cheese",cat:1,n:"Cheese Bog's",d:"Pan de papa artesanal, medallón de 120 gs y cheddar fundido al fuego vivo.",p:11000,img:6,tag:"120G",o:"b",specs:[["lunch_dining","120g Carne","Smash"],["bakery_dining","Pan de Papa","Esponjoso"],["timer","12 - 15 min","Punto justo"]]},
 {id:"doble",cat:1,n:"Doble Cheese Bog's",d:"Pan de papa, doble medallón de 120 gs y triple ración de cheddar cremoso.",long:"Pan de papa artesanal dorado a la manteca, doble medallón smash de 120 g con costra crocante y triple feta fundida de queso cheddar puro. Sabor monumental.",p:13000,img:15,hero:4,tag:"TOP",fav:1,o:"b",specs:[["lunch_dining","240g Carne","Doble smash"],["bakery_dining","Pan de Papa","Esponjoso"],["timer","15 - 20 min","Punto justo"]]},
 {id:"bacon",cat:1,n:"Bacon Bog's",d:"Doble medallón, cheddar, panceta crocante y salsa Zeus ahumada.",p:14500,img:3,o:"b",specs:[["lunch_dining","240g Carne","Doble smash"],["outdoor_grill","Panceta","Crocante"],["timer","15 - 20 min","Punto justo"]]},
 {id:"olympus",cat:1,n:"Olympus Triple",d:"Triple medallón, cheddar x4, cebolla crispy y pepinos. Para titanes.",p:17000,img:11,tag:"XL",o:"b",specs:[["lunch_dining","360g Carne","Triple smash"],["bakery_dining","Pan de Papa","Doble tostado"],["timer","18 - 22 min","Punto justo"]]},
 {id:"muzza",cat:2,n:"Muzza Gigante",d:"Masa fina y crocante, salsa de tomates italianos cocida lento y abundante muzzarella.",p:7000,img:7,tag:"CRUJIENTE",pz:1,o:"p",specs:[["local_pizza","Porción XL","Plegable"],["grain","Masa madre","Fina y crujiente"],["timer","10 - 12 min","Horno de piedra"]]},
 {id:"pepp",cat:2,n:"Pepperoni Gigante",d:"Masa fina, abundante muzzarella dorada y pepperoni crocante importado estilo NYC.",p:8000,img:13,tag:"NYC ICON",red:1,pz:1,o:"p",specs:[["local_pizza","Porción XL","Plegable"],["local_fire_department","Pepperoni","Picante suave"],["timer","10 - 12 min","Horno de piedra"]]},
 {id:"duo",cat:2,n:"Dúo NY",d:"Una muzza + una pepperoni. Dos porciones gigantes para dos dioses.",p:14000,img:5,pz:1,o:"p",specs:[["local_pizza","2 porciones","XL"],["group","Para 2","Compartir"],["timer","12 - 15 min","Horno de piedra"]]},
 {id:"combo1",cat:3,n:"Combo Cheese",d:"Cheese Bog's + papas Bog's + gaseosa 500 ml.",p:16000,img:6,o:"b",specs:[["lunch_dining","Cheese Bog's","120g"],["fastfood","Papas","Porción"],["local_drink","Gaseosa","500 ml"]]},
 {id:"combo2",cat:3,n:"Combo Doble",d:"Doble Cheese Bog's + papas Bog's + gaseosa 500 ml.",p:18000,img:8,tag:"MÁS PEDIDO",o:"b",specs:[["lunch_dining","Doble Cheese","240g"],["fastfood","Papas","Porción"],["local_drink","Gaseosa","500 ml"]]},
 {id:"papas",cat:4,n:"Papas Bog's",d:"Siempre frescas, corte bastón, sal marina.",p:5000,ic:"fastfood",specs:[["fastfood","Porción","Para 1-2"],["water_drop","Sal marina","Gruesa"],["timer","8 min","Doble fritura"]]},
 {id:"papasch",cat:4,n:"Papas Cheddar & Bacon",d:"Cheddar fundido, panceta crocante y verdeo.",p:7500,ic:"fastfood",tag:"TOP",specs:[["fastfood","Porción","Para 2"],["layers","Cheddar","Fundido"],["timer","10 min","Doble fritura"]]},
 {id:"coca",cat:5,n:"Coca-Cola 500 ml",d:"Bien fría, de la heladera de los dioses.",p:2200,ic:"local_drink",specs:[["ac_unit","Fría","-2°"],["local_drink","500 ml","Botella"],["timer","0 min","Lista"]]},
 {id:"agua",cat:5,n:"Agua sin gas 500 ml",d:"Mineral, bien fría.",p:1800,ic:"water_drop",specs:[["ac_unit","Fría","-2°"],["water_drop","500 ml","Botella"],["timer","0 min","Lista"]]},
 {id:"birra",cat:5,n:"Birra IPA 473 ml",d:"Lata artesanal, lúpulo cítrico.",p:4500,ic:"sports_bar",specs:[["ac_unit","Fría","-2°"],["sports_bar","473 ml","Lata"],["timer","0 min","Lista"]]}];
const byId=id=>P.find(x=>x.id===id),fmt=n=>"$"+Math.round(n).toLocaleString("es-AR");
let S={view:"home",cat:0,cart:[],mode:"delivery",pay:"mp",fav:new Set(["doble"]),orders:[],q:"",note:"",det:null,sumOpen:false,
 user:{name:"Lucas Benítez",phone:"11 4994 8134",addr:"Av. Espora 2450",city:"Burzaco",floor:"4° B",instr:"Timbre roto, avisar por WhatsApp"}};
const SHIP=1800,FREE=25000;
const unit=l=>{const p=byId(l.pid);return p.p+l.opts.reduce((a,i)=>a+OPTS[p.o][i][2],0)};
const sub=()=>S.cart.reduce((a,l)=>a+unit(l)*l.q,0),cnt=()=>S.cart.reduce((a,l)=>a+l.q,0);
const ship=()=>S.mode==="delivery"&&sub()<FREE&&S.cart.length?SHIP:0;
const disc=()=>S.pay==="transfer"?sub()*.1:0;
const total=()=>sub()+ship()-disc();
const ic=(n,c="")=>`<span class="msy ${c}">${n}</span>`;
const pic=(p,cls,big)=>p.img?`<img src="${IMG[big&&p.hero?p.hero:p.img]}" alt="${p.n}" class="${cls} object-cover">`:`<div class="${cls} ember bg-surface-container-lowest flex items-center justify-center">${ic(p.ic,"text-primary "+(big?"text-[120px]":"text-[44px]"))}</div>`;

/* ---------- shell ---------- */
function hdr(o={}){return `<header class="shrink-0 z-20 bg-surface/90 backdrop-blur-xl pt-10"><div class="h-16 px-4 flex items-center justify-between gap-3">
 ${o.back?`<button onclick="go('${o.back}')" class="w-10 h-10 -ml-2 flex items-center justify-center text-on-surface">${ic("arrow_back")}</button>`:""}
 <img src="${IMG.logo}" alt="BOG'S" class="h-8 w-auto rounded">
 ${o.title?`<h1 class="font-anton text-[20px] uppercase tracking-wide flex-1 truncate">${o.title}</h1>`:`<button onclick="go('account')" class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-surface-container min-h-[44px] flex-1 justify-center max-w-[210px]">${ic("location_on","text-primary text-[18px]")}<span class="flex flex-col text-left"><span class="text-[11px] font-semibold tracking-[.06em] text-on-surface-variant uppercase leading-none">Entregar en</span><span class="text-[13px] font-semibold text-on-surface leading-none mt-0.5">${S.user.city}</span></span>${ic("expand_more","text-outline text-[16px]")}</button>`}
 <button onclick="go('account')" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center shadow-[0_0_12px_rgba(233,174,59,0.25)] shrink-0">${ic("person","text-on-primary text-[18px]")}</button>
</div></header>`}
function nav(a){const it=[["home","local_fire_department","Inicio"],["search","search","Buscar"],["cart","shopping_bag","Pedido"],["account","person","Cuenta"]];
 return `<nav class="shrink-0 z-20 bg-surface/90 backdrop-blur-xl shadow-[0_-4px_16px_rgba(0,0,0,0.5)]"><div class="flex justify-around items-center h-16 px-4 pb-1">${it.map(([v,i,l])=>`<button onclick="go('${v}')" class="flex flex-col items-center justify-center gap-1 w-16 h-12 ${a===v?"text-primary":"text-on-surface-variant"}"><span class="relative">${ic(i,a===v?"f":"")}${v==="cart"&&cnt()?`<span class="absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-primary ring-2 ring-surface"></span>`:""}</span><span class="text-[11px] font-semibold tracking-[.06em]">${l}</span></button>`).join("")}</div></nav>`}
const cartBar=()=>cnt()?`<div class="px-4 pb-2 pt-1"><button onclick="go('cart')" class="w-full gold-bar text-on-primary rounded-xl p-3 flex items-center justify-between press transition-transform"><span class="flex items-center gap-2.5"><span class="w-8 h-8 rounded-full bg-on-primary/15 flex items-center justify-center">${ic("shopping_bag","text-[18px]")}</span><span class="flex flex-col text-left leading-tight"><span class="text-[13px] font-bold uppercase tracking-wide">Ver pedido · ${cnt()} ítem${cnt()>1?"s":""}</span><span class="text-[12px] text-on-primary/80 font-medium">BOG'S ${S.user.city}</span></span></span><span class="flex items-center gap-1.5"><span class="font-anton text-[22px] tracking-wide">${fmt(sub())}</span>${ic("arrow_forward","text-[20px]")}</span></button></div>`:"";
const card=p=>`<div class="w-full bg-surface-container-low rounded-xl overflow-hidden p-3 flex gap-3 items-center shadow-md border border-primary/10 cursor-pointer" onclick="openDet('${p.id}')">
 <div class="w-28 h-28 shrink-0 rounded-lg overflow-hidden bg-surface-container-lowest relative">${pic(p,"w-full h-full")}${p.tag?`<div class="absolute ${p.tag.length>4?"top-1 left-1":"bottom-1 right-1"} px-1.5 py-0.5 rounded text-[11px] font-bold tracking-[.06em] ${p.red?"bg-error-container text-on-error-container":p.tag.length>4?"bg-primary text-on-primary":"bg-surface-container-lowest/80 text-primary"}">${p.tag}</div>`:""}</div>
 <div class="flex flex-col justify-between flex-1 min-w-0 h-28 py-0.5"><div><h4 class="font-anton text-[20px] uppercase text-on-surface truncate tracking-wide">${p.n}</h4><p class="text-[12px] text-on-surface-variant line-clamp-2 mt-0.5">${p.d}</p></div>
 <div class="flex items-center justify-between mt-auto"><span class="font-anton text-[22px] ${p.pz?"text-secondary":"text-primary"}">${fmt(p.p)}</span><button aria-label="Agregar ${p.n}" onclick="event.stopPropagation();quickAdd('${p.id}',this)" class="w-9 h-9 ${p.pz?"bg-secondary text-on-secondary":"bg-primary text-on-primary"} rounded-full flex items-center justify-center shadow-md active:scale-90 transition-transform">${ic("add","text-[20px]")}</button></div></div></div>`;
const secHead=(i,t,r,sec)=>`<div class="flex items-center justify-between"><div class="flex items-center gap-1.5">${ic(i,(sec?"text-secondary":"text-primary")+" text-[20px]")}<h3 class="font-anton text-[24px] uppercase tracking-wide">${t}</h3></div><span class="text-[11px] font-bold tracking-[.08em] uppercase ${sec?"text-secondary":"text-outline"}">${r}</span></div>`;

/* ---------- screens ---------- */
function home(){const h=byId("doble");const secs=[[1,"star","Los Favoritos","Recetas de los dioses"],[2,"local_pizza","Pizza Estilo New York","Porción Gigante",1],[3,"bolt","Combos","Armá tu festín"],[4,"fastfood","Papas","Siempre frescas"],[5,"local_drink","Bebidas","Bien frías"]];
 return hdr()+`<main class="flex-1 overflow-y-auto ns"><div class="px-4 pt-2"><div class="flex items-center justify-between bg-surface-container-low px-4 py-2.5 rounded-xl"><div class="flex items-center gap-2">${ic("bolt","text-primary text-[18px]")}<span class="text-[11px] font-semibold tracking-[.08em] uppercase">Demora estimada: <strong class="text-primary">35–50 min</strong></span></div><div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span class="text-[11px] text-outline">Cocina prendida</span></div></div></div>
 <section class="px-4 pt-3 pb-3"><div class="relative overflow-hidden rounded-xl bg-surface-container-low shadow-xl border border-primary/10"><div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/60 to-transparent z-10 pointer-events-none"></div>
  <div class="relative w-full h-56 overflow-hidden"><img src="${IMG[8]}" alt="Doble Cheese Bog's" class="w-full h-full object-cover scale-105"><div class="absolute top-3 left-3 z-20 flex items-center gap-1 bg-error-container text-on-error-container px-2.5 py-1 rounded-full">${ic("local_fire_department","text-[14px]")}<span class="text-[11px] font-bold uppercase tracking-wider">Más pedida</span></div><div class="absolute top-3 right-3 z-20 bg-surface-container-lowest/80 backdrop-blur-md px-2 py-0.5 rounded"><span class="text-[11px] text-primary uppercase tracking-widest font-semibold">Sabor Divino</span></div></div>
  <div class="relative z-20 px-4 pb-4 pt-1 flex flex-col gap-2"><div class="flex items-baseline justify-between"><h2 class="font-anton text-[28px] uppercase tracking-wide">${h.n}</h2><span class="font-anton text-[22px] text-primary">${fmt(h.p)}</span></div><p class="text-[14px] text-on-surface-variant">Doble medallón de 120g smash · triple cheddar fundido · pan de papa tostado en manteca clarificada.</p>
  <div class="pt-1 flex items-center gap-2"><button onclick="openDet('doble')" class="flex-1 bg-primary text-on-primary py-3 px-4 rounded-lg flex items-center justify-center gap-2 shadow-lg press transition-transform">${ic("bolt","text-[20px]")}<span class="text-[15px] font-bold uppercase tracking-wider">Pedir Ahora</span></button><button onclick="favT('doble')" class="w-12 h-12 bg-surface-container-high text-primary rounded-lg flex items-center justify-center active:scale-95">${ic("favorite",S.fav.has("doble")?"f text-[20px]":"text-[20px]")}</button></div></div></div></section>
 <div class="flex items-center gap-2 overflow-x-auto px-4 py-2 ns">${CATS.map((c,i)=>`<button onclick="S.cat=${i};render()" class="shrink-0 text-[13px] font-semibold tracking-[.04em] uppercase px-4 py-2 rounded-full ${i===S.cat?"bg-primary text-on-primary shadow-[0_0_14px_rgba(233,174,59,.35)]":"bg-surface-container text-on-surface-variant"}">${c}</button>`).join("")}</div>
 ${secs.filter(s=>!S.cat||S.cat===s[0]).map(s=>`<section class="px-4 pt-4 pb-1 flex flex-col gap-3">${secHead(s[1],s[2],s[3],s[4])}${P.filter(p=>p.cat===s[0]).map(card).join("")}</section>`).join("")}
 <section class="px-4 pt-4 pb-6"><div class="rounded-xl bg-surface-container p-4 flex items-center justify-between gap-3"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-surface-bright flex items-center justify-center shrink-0">${ic("bolt","text-primary text-[22px]")}</div><div class="flex flex-col"><span class="text-[13px] font-semibold uppercase">¿Sos fanático?</span><span class="text-[12px] text-on-surface-variant">Pidiendo directo tenés 10% OFF</span></div></div><button onclick="go('account')" class="bg-surface-bright text-primary px-3 py-2 rounded-lg text-[11px] uppercase font-bold tracking-wider shrink-0">Ver Club</button></div></section></main>`+cartBar()+nav("home")}

function detail(){const p=byId(S.det.pid),d=S.det,o=p.o?OPTS[p.o]:[],u=p.p+d.opts.reduce((a,i)=>a+o[i][2],0);
 return hdr({back:d.from||"home",title:"Detalle de producto"})+`<main class="flex-1 overflow-y-auto ns"><div class="relative h-80 bg-surface-container-lowest">${pic(p,"w-full h-full",1)}<div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent"></div>
  <div class="absolute top-4 left-4 flex gap-2"><button onclick="go('${d.from||"home"}')" class="w-11 h-11 rounded-full bg-surface-container-lowest/70 backdrop-blur flex items-center justify-center">${ic("arrow_back")}</button></div>
  <div class="absolute top-4 right-4 flex gap-2"><button onclick="favT('${p.id}')" class="w-11 h-11 rounded-full bg-surface-container-lowest/70 backdrop-blur flex items-center justify-center text-tertiary">${ic("favorite",S.fav.has(p.id)?"f":"")}</button><button onclick="toast('Link copiado')" class="w-11 h-11 rounded-full bg-surface-container-lowest/70 backdrop-blur flex items-center justify-center">${ic("share")}</button></div>
  <div class="absolute bottom-3 left-4 flex gap-2">${p.fav?`<span class="flex items-center gap-1 bg-tertiary/90 text-[#690002] px-3 py-1.5 rounded-full text-[11px] font-bold uppercase tracking-wider">${ic("local_fire_department","text-[14px]")}Bog's favorita</span>`:""}<span class="flex items-center gap-1 bg-surface-container-high px-2.5 py-1.5 rounded-full text-[12px] font-semibold">${ic("star","f text-primary text-[14px]")}4.9</span></div></div>
 <div class="px-4 pt-4"><div class="flex justify-between gap-4"><h2 class="font-anton text-[38px] leading-[40px] uppercase">${p.n}</h2><div class="text-right shrink-0"><div class="font-anton text-[24px] text-primary">${fmt(p.p)}</div><div class="text-[12px] text-on-surface-variant font-semibold">Precio base</div></div></div>
  <div class="flex items-center gap-1.5 mt-2 text-primary text-[11px] font-bold uppercase tracking-[.08em]">${ic("bolt","text-[16px]")}${p.pz?"La pizza de los dioses":"La hamburguesa de los dioses"}</div>
  <p class="text-[15px] text-on-surface-variant mt-3 leading-relaxed">${p.long||p.d}</p>
