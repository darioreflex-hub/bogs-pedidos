<script>
(function(){const r=document.documentElement;let last=0;function fit(){const vv=window.visualViewport;const h=Math.round(Math.max(window.innerHeight||0,vv?vv.height:0));if(h&&h!==last){last=h;r.style.setProperty("--vh",h+"px")}if(/[?&]debug/.test(location.search))dbg()}window.BOGS_VER="1788621525";function dbg(){let d=document.getElementById("dbg");if(!d){d=document.createElement("pre");d.id="dbg";d.style.cssText="position:fixed;left:6px;top:60px;z-index:9999;background:#000c;color:#0f0;font:11px/1.4 monospace;padding:8px;border-radius:6px;pointer-events:none;white-space:pre";document.body.appendChild(d)}const app=document.getElementById("app"),nav=document.querySelector("nav"),vv=window.visualViewport;d.textContent=["ver "+window.BOGS_VER,"innerH "+innerHeight+"  innerW "+innerWidth,"visualVP "+(vv?Math.round(vv.height)+" off "+Math.round(vv.offsetTop)+" scale "+vv.scale.toFixed(2):"n/a"),"clientH "+document.documentElement.clientHeight+"  screenH "+screen.height,"--vh "+getComputedStyle(r).getPropertyValue("--vh").trim(),"app "+(app?Math.round(app.getBoundingClientRect().height)+" top "+Math.round(app.getBoundingClientRect().top):"-"),"nav bottom "+(nav?Math.round(nav.getBoundingClientRect().bottom):"-"),"body "+Math.round(document.body.getBoundingClientRect().height)+" scrollY "+scrollY,"safe-b "+getComputedStyle(document.querySelector(".safe-b")||document.body).paddingBottom,"UA "+navigator.userAgent.replace(/.*(OS [\d_]+|Android [\d.]+).*/,"$1")].join("\n")}fit();addEventListener("resize",fit);addEventListener("orientationchange",()=>setTimeout(fit,250));if(window.visualViewport)visualViewport.addEventListener("resize",fit);addEventListener("pageshow",fit);setTimeout(fit,300);setTimeout(fit,1200)})();
const D=window.BOGS_DEFAULTS,CATS=D.cats,OPTS=D.opts,ST=D.statuses,E2E=/[?&]e2e/.test(location.search);
let CFG={...D.settings},P=D.menu.map(x=>({available:true,...x}));
let db=null,unsubOrder=null;
try{firebase.initializeApp(D.fb);db=firebase.firestore();
 db.collection("settings").doc("store").onSnapshot(s=>{if(s.exists){CFG={...D.settings,...s.data()};render()}},e=>console.warn("settings",e));
 db.collection("menu").orderBy("order").onSnapshot(s=>{if(!s.empty){PALL=s.docs.map(d=>({available:true,...d.data(),id:d.id}));P=PALL.filter(p=>!p.hidden);S.cart=S.cart.filter(l=>byId(l.pid));if(S.det&&!byId(S.det.pid))S.view="home";render()}},e=>console.warn("menu",e));
}catch(e){console.warn("firebase off",e)}
let PALL=P;const byId=id=>P.find(x=>x.id===id),optsOf=p=>p&&Array.isArray(p.extras)&&p.extras.length?p.extras:(p&&p.o&&OPTS[p.o])||[],fmt=n=>"$"+Math.round(n).toLocaleString("es-AR");
let S={view:"home",cat:0,cart:[],mode:"delivery",pay:"mp",fav:new Set(["doble"]),orders:[],q:"",note:"",det:null,sumOpen:false,live:{},
 user:{name:"",phone:"",addr:"",city:D.settings.city,floor:"",instr:""}};
try{const u=JSON.parse(localStorage.getItem("bogs_user"));if(u)S.user={...S.user,...u};S.orders=JSON.parse(localStorage.getItem("bogs_orders")||"[]")}catch(e){}
const saveLocal=()=>{try{localStorage.setItem("bogs_user",JSON.stringify(S.user));localStorage.setItem("bogs_orders",JSON.stringify(S.orders.slice(0,20)))}catch(e){}};
const unit=l=>{const p=byId(l.pid);if(!p)return 0;const o=optsOf(p);return p.p+l.opts.reduce((a,i)=>a+(o[i]?.[2]||0),0)};
const sub=()=>S.cart.reduce((a,l)=>a+unit(l)*l.q,0),cnt=()=>S.cart.reduce((a,l)=>a+l.q,0);
const zone=()=>(CFG.zones||[]).find(z=>z.name===S.user.city)||(CFG.zones||[])[0]||{name:CFG.city,cost:CFG.ship};
const FE=()=>CFG.features||{};
const freeShipReason=()=>!S.cart.length||S.mode!=="delivery"?"":FE().freeShipAll?"Envío gratis en toda la tienda":S.cart.some(l=>byId(l.pid)?.freeShip)?"Tu pedido incluye un producto con envío gratis":sub()>=CFG.freeFrom?"Superaste los "+fmt(CFG.freeFrom):S.coupon?.type==="freeship"?"Cupón "+S.coupon.code:"";
const ship=()=>S.mode==="delivery"&&S.cart.length&&!freeShipReason()?zone().cost:0;
const tDisc=()=>S.pay==="transfer"?sub()*CFG.transferOff/100:0;
const cDisc=()=>{const c=S.coupon;if(!c||!FE().coupons||sub()<(c.minSubtotal||0))return 0;return c.type==="percent"?sub()*c.value/100:c.type==="fixed"?Math.min(c.value,sub()):0};
const kDisc=()=>FE().club&&S.clubReward?sub()*(CFG.club?.rewardPct||0)/100:0;
const disc=()=>Math.min(sub(),tDisc()+cDisc()+kDisc());
const total=()=>sub()-disc()+ship();
const ic=(n,c="")=>`<span class="msy ${c}">${n}</span>`;
const src=f=>"img/"+f;
const pic=(p,cls,kind)=>{const ff=kind==="hero"?p.hero:kind==="home"?(p.home||p.hero):null;const f=ff?src(ff):(p.imgData||(p.img?src(p.img):null));return f?`<img src="${f}" alt="${p.n}" class="${cls} object-cover">`:`<div class="${cls} ember bg-surface-container-lowest flex items-center justify-center">${ic(p.ic||"restaurant","text-primary "+(kind?"text-[120px]":"text-[44px]"))}</div>`};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- shell ---------- */
function hdr(o={}){return `<header class="shrink-0 z-20 bg-surface/90 backdrop-blur-xl safe-t"><div class="h-16 px-4 flex items-center justify-between gap-3">
 ${o.back?`<button onclick="go('${o.back}')" class="w-10 h-10 -ml-2 flex items-center justify-center text-on-surface">${ic("arrow_back")}</button>`:""}
 <img src="img/logo.jpg" alt="BOG'S" class="h-8 w-auto rounded">
 ${o.title?`<h1 class="font-anton text-[20px] uppercase tracking-wide flex-1 truncate">${o.title}</h1>`:`<button onclick="go('account')" class="flex items-center gap-1.5 px-2 py-1 rounded-full bg-surface-container min-h-[44px] flex-1 justify-center max-w-[210px]">${ic("location_on","text-primary text-[18px]")}<span class="flex flex-col text-left"><span class="text-[11px] font-semibold tracking-[.06em] text-on-surface-variant uppercase leading-none">Entregar en</span><span class="text-[13px] font-semibold text-on-surface leading-none mt-0.5">${esc(S.user.city||CFG.city)}</span></span>${ic("expand_more","text-outline text-[16px]")}</button>`}
 <button onclick="go('account')" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center shadow-[0_0_12px_rgba(233,174,59,0.25)] shrink-0">${ic("person","text-on-primary text-[18px]")}</button>
</div></header>`}
function nav(a){const it=[["home","local_fire_department","Inicio"],["search","search","Buscar"],["cart","shopping_bag","Pedido"],["account","person","Cuenta"]];

const cartBar=()=>cnt()?`<div class="px-4 pb-2 pt-1"><button onclick="go('cart')" class="w-full gold-bar text-on-primary rounded-xl p-3 flex items-center justify-between press transition-transform"><span class="flex items-center gap-2.5"><span class="w-8 h-8 rounded-full bg-on-primary/15 flex items-center justify-center">${ic("shopping_bag","text-[18px]")}</span><span class="flex flex-col text-left leading-tight"><span class="text-[13px] font-bold uppercase tracking-wide">Ver pedido · ${cnt()} ítem${cnt()>1?"s":""}</span><span class="text-[12px] text-on-primary/80 font-medium">BOG'S ${esc(CFG.city)}</span></span></span><span class="flex items-center gap-1.5"><span class="font-anton text-[22px] tracking-wide">${fmt(sub())}</span>${ic("arrow_forward","text-[20px]")}</span></button></div>`:"";
const card=p=>{const off=p.available===false;const pct=p.oldPrice>p.p?Math.round((1-p.p/p.oldPrice)*100):0;return `<div class="w-full bg-surface-container-low rounded-xl overflow-hidden p-3 flex gap-3 items-center shadow-md border border-primary/10 cursor-pointer ${off?"opacity-60":""}" onclick="${off?"toast('Agotado por hoy')":`openDet('${p.id}')`}">
 <div class="w-28 h-28 shrink-0 rounded-lg overflow-hidden bg-surface-container-lowest relative">${pic(p,"w-full h-full")}${off?`<div class="absolute inset-0 bg-black/60 flex items-center justify-center text-[12px] font-bold tracking-[.1em] uppercase">Agotado</div>`:p.tag?`<div class="absolute ${p.tag.length>4?"top-1 left-1":"bottom-1 right-1"} px-1.5 py-0.5 rounded text-[11px] font-bold tracking-[.06em] ${p.red?"bg-error-container text-on-error-container":p.tag.length>4?"bg-primary text-on-primary":"bg-surface-container-lowest/80 text-primary"}">${esc(p.tag)}</div>`:""}</div>
 <div class="flex flex-col justify-between flex-1 min-w-0 h-28 py-0.5"><div><h4 class="font-anton text-[20px] uppercase text-on-surface truncate tracking-wide">${esc(p.n)}</h4><p class="text-[12px] text-on-surface-variant line-clamp-2 mt-0.5">${esc(p.d)}</p></div>
 <div class="flex items-center justify-between mt-auto"><span class="flex items-baseline gap-1.5 flex-wrap"><span class="font-anton text-[22px] ${p.pz?"text-secondary":"text-primary"}">${fmt(p.p)}</span>${pct?`<s class="text-[12px] text-outline">${fmt(p.oldPrice)}</s><span class="bg-error-container text-on-error-container text-[10px] font-bold px-1.5 py-0.5 rounded">-${pct}%</span>`:""}${p.freeShip&&!FE().freeShipAll?`<span class="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-1.5 py-0.5 rounded uppercase">Envío gratis</span>`:""}</span>${off?"":`<button aria-label="Agregar ${esc(p.n)}" onclick="event.stopPropagation();quickAdd('${p.id}',this)" class="w-9 h-9 ${p.pz?"bg-secondary text-on-secondary":"bg-primary text-on-primary"} rounded-full flex items-center justify-center shadow-md active:scale-90 transition-transform">${ic("add","text-[20px]")}</button>`}</div></div></div>`};

 :`<div class="flex items-center gap-2 bg-error-container/40 border border-error-container px-4 py-2.5 rounded-xl">${ic("bedtime","text-tertiary text-[18px]")}<span class="text-[11px] font-semibold tracking-[.08em] uppercase text-on-error-container">${esc(CFG.open&&!window.BOGS_inHours(CFG.hours)?"Cerrado ahora · "+window.BOGS_hoursText(CFG.hours):CFG.closedMsg)}</span></div>`;

function home(){const h=P.find(x=>x.featured&&x.available!==false)||P.find(x=>x.available!==false)||P[0];const secs=[[1,"star","Los Favoritos","Recetas de los dioses"],[2,"local_pizza","Pizza Estilo New York","Porción Gigante",1],[3,"bolt","Combos","Armá tu festín"],[4,"fastfood","Papas","Siempre frescas"],[5,"local_drink","Bebidas","Bien frías"]];
 return hdr()+`<main class="flex-1 overflow-y-auto ns"><div class="px-4 pt-2">${ticker()}</div>
 ${h?`<section class="px-4 pt-3 pb-3"><div class="relative overflow-hidden rounded-xl bg-surface-container-low shadow-xl border border-primary/10"><div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest/60 to-transparent z-10 pointer-events-none"></div>
  <div class="relative w-full h-56 overflow-hidden">${pic(h,"w-full h-full scale-105","home")}<div class="absolute top-3 left-3 z-20 flex items-center gap-1 bg-error-container text-on-error-container px-2.5 py-1 rounded-full">${ic("local_fire_department","text-[14px]")}<span class="text-[11px] font-bold uppercase tracking-wider">Más pedida</span></div><div class="absolute top-3 right-3 z-20 bg-surface-container-lowest/80 backdrop-blur-md px-2 py-0.5 rounded"><span class="text-[11px] text-primary uppercase tracking-widest font-semibold">Sabor Divino</span></div></div>
  <div class="relative z-20 px-4 pb-4 pt-1 flex flex-col gap-2"><div class="flex items-baseline justify-between"><h2 class="font-anton text-[28px] uppercase tracking-wide">${esc(h.n)}</h2><span class="font-anton text-[22px] text-primary">${fmt(h.p)}</span></div><p class="text-[14px] text-on-surface-variant">${esc(h.long||h.d)}</p>
  <div class="pt-1 flex items-center gap-2"><button onclick="openDet('${h.id}')" class="flex-1 bg-primary text-on-primary py-3 px-4 rounded-lg flex items-center justify-center gap-2 shadow-lg press transition-transform">${ic("bolt","text-[20px]")}<span class="text-[15px] font-bold uppercase tracking-wider">Pedir Ahora</span></button><button onclick="favT('${h.id}')" class="w-12 h-12 bg-surface-container-high text-primary rounded-lg flex items-center justify-center active:scale-95">${ic("favorite",S.fav.has(h.id)?"f text-[20px]":"text-[20px]")}</button></div></div></div></section>`:""}
 <div class="flex items-center gap-2 overflow-x-auto px-4 py-2 ns">${CATS.map((c,i)=>`<button onclick="S.cat=${i};render()" class="shrink-0 text-[13px] font-semibold tracking-[.04em] uppercase px-4 py-2 rounded-full ${i===S.cat?"bg-primary text-on-primary shadow-[0_0_14px_rgba(233,174,59,.35)]":"bg-surface-container text-on-surface-variant"}">${c}</button>`).join("")}</div>

 <section class="px-4 pt-4 pb-6"><div class="rounded-xl bg-surface-container p-4 flex items-center justify-between gap-3"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full bg-surface-bright flex items-center justify-center shrink-0">${ic("bolt","text-primary text-[22px]")}</div><div class="flex flex-col"><span class="text-[13px] font-semibold uppercase">¿Sos fanático?</span><span class="text-[12px] text-on-surface-variant">${FE().club?`Club Bog's: cada ${CFG.club?.every} pedidos, el siguiente con ${CFG.club?.rewardPct}% OFF`:`Pagando por transferencia tenés ${CFG.transferOff}% OFF`}</span></div></div><button onclick="go('account')" class="bg-surface-bright text-primary px-3 py-2 rounded-lg text-[11px] uppercase font-bold tracking-wider shrink-0">Ver Club</button></div></section></main>`+cartBar()+nav("home")}

function detail(){const p=byId(S.det.pid);if(!p)return home();const d=S.det,o=optsOf(p),u=p.p+d.opts.reduce((a,i)=>a+o[i][2],0);

  <div class="absolute top-4 right-4 flex gap-2"><button onclick="favT('${p.id}')" class="w-11 h-11 rounded-full bg-surface-container-lowest/70 backdrop-blur flex items-center justify-center text-tertiary">${ic("favorite",S.fav.has(p.id)?"f":"")}</button><button onclick="share('${p.id}')" class="w-11 h-11 rounded-full bg-surface-container-lowest/70 backdrop-blur flex items-center justify-center">${ic("share")}</button></div>

 return flow.map((k,i)=>{const s=ST.find(x=>x[0]===k);return [s[3],s[1],k==="camino"?"Aprox. "+CFG.eta:k==="listo"?"Pasá por "+CFG.pickup:s[2],i<idx?1:i===idx?2:0]})}
function done(){const o=S.orders[0],live=S.live[o.id]||{};const st=statusSteps({...o,...live});
 return hdr({title:"Confirmación"})+prog(3,"Paso 3 de 3","¡Listo!")+`<main class="flex-1 overflow-y-auto ns px-4 pt-6 pb-6"><div class="text-center"><div class="w-24 h-24 mx-auto rounded-full gold-bar flex items-center justify-center">${ic("check","text-on-primary text-[52px]")}</div><h2 class="font-anton text-[40px] uppercase mt-4 leading-none">Pedido ${o.code}</h2><p class="text-[15px] text-on-surface-variant mt-2">${fmt(o.total)} · ${{mp:"Mercado Pago",transfer:"Transferencia",cash:"Efectivo"}[o.pay]} · ${o.mode==="delivery"?"Delivery a "+esc(o.addr):"Retiro en local"}</p>${db?`<p class="text-[12px] text-primary font-bold uppercase tracking-wider mt-2 flex items-center justify-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>Seguimiento en vivo</p>`:""}</div>
 <div class="mt-8 flex flex-col">${st.map((s,i)=>`<div class="grid grid-cols-[32px_1fr] gap-4 pb-6 relative">${i<st.length-1?`<div class="absolute left-[15px] top-8 bottom-0 w-0.5 ${s[3]===1?"bg-primary":"bg-surface-container-high"}"></div>`:""}<div class="w-8 h-8 rounded-full flex items-center justify-center ${s[3]===1?"bg-primary text-on-primary":s[3]===2?"border-2 border-primary text-primary animate-pulse":"bg-surface-container-high text-outline"}">${ic(s[0],"text-[16px]")}</div><div><div class="text-[16px] font-bold uppercase tracking-wide">${s[1]}</div><div class="text-[13px] text-on-surface-variant">${s[2]}</div></div></div>`).join("")}</div>
 <a href="${o.wa}" target="_blank" class="w-full border-[1.5px] border-wa rounded-xl py-3.5 flex items-center justify-center gap-2 text-[14px] font-bold uppercase tracking-wider">${ic("chat","text-wa")}Abrir WhatsApp si no se abrió</a></main>
 <div class="glass px-4 pt-3 pb-8"><button onclick="go('home')" class="w-full bg-primary text-on-primary rounded-xl py-4 font-anton text-[20px] uppercase tracking-wider">Volver al inicio</button></div>`}

function search(){const q=S.q.trim().toLowerCase(),r=q?P.filter(p=>(p.n+" "+p.d).toLowerCase().includes(q)):P.filter(p=>S.fav.has(p.id)||p.tag);
 return hdr()+`<main class="flex-1 overflow-y-auto ns px-4 pt-2 pb-4 flex flex-col gap-3"><h2 class="font-anton text-[36px] uppercase py-1">Buscar</h2><div class="flex items-center gap-3 bg-surface-container-low border border-white/10 rounded-xl px-4">${ic("search","text-primary")}<input id="q" value="${esc(S.q)}" oninput="S.q=this.value;renderKeep('q')" placeholder="Cheddar, pepperoni, combo…" class="flex-1 bg-transparent py-3.5 text-[16px] placeholder:text-outline">${S.q?`<button onclick="S.q='';render()">${ic("close","text-outline")}</button>`:""}</div>
 <div class="flex gap-2 flex-wrap">${["Doble","Pepperoni","Combo","Birra","Bacon"].map(t=>`<button onclick="S.q='${t}';render()" class="bg-surface-container text-on-surface-variant text-[12px] font-semibold uppercase tracking-wider px-3 py-1.5 rounded-full">${t}</button>`).join("")}</div>
 <div class="text-[11px] font-bold uppercase tracking-[.08em] text-outline pt-1">${q?r.length+" resultados":"Destacados y favoritos"}</div>${r.map(card).join("")||`<p class="text-on-surface-variant text-center py-10">Nada por acá. Probá con otro sabor.</p>`}</main>`+cartBar()+nav("search")}

function account(){const ini=(S.user.name||"B").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
 return hdr()+`<main class="flex-1 overflow-y-auto ns px-4 pt-2 pb-6 flex flex-col gap-3"><div class="flex items-center gap-4 py-2"><div class="w-16 h-16 rounded-full gold-bar flex items-center justify-center font-anton text-[26px] text-on-primary">${ini}</div><div><h2 class="font-anton text-[28px] uppercase leading-none">${esc(S.user.name||"Tu cuenta")}</h2><div class="text-[13px] text-on-surface-variant mt-1 flex items-center gap-1">${ic("workspace_premium","text-primary text-[16px]")}Club Bog's · ${S.orders.length>=3?"Nivel Titán":"Nivel Mortal"}</div></div></div>
 <div class="rounded-xl p-4 gold-bar text-on-primary flex items-center justify-between"><div><div class="text-[11px] font-bold uppercase tracking-[.1em] opacity-80">Beneficio activo</div><div class="font-anton text-[22px] uppercase">${CFG.transferOff}% OFF por transferencia</div></div>${ic("bolt","text-[32px]")}</div>${clubCard()}
 <h3 class="font-anton text-[20px] uppercase mt-2">Mis datos</h3>${fld("name","Nombre y apellido","badge","Tu nombre")}${fld("phone","Teléfono / WhatsApp","chat","11 1234 5678")}${fld("addr","Dirección habitual","location_on","Calle y número")}${zoneSel()}
 <h3 class="font-anton text-[20px] uppercase mt-2">Mis pedidos</h3>${S.orders.length?S.orders.map(o=>{const l=S.live[o.id]||{},s=ST.find(x=>x[0]===(l.status||o.status||"nuevo"));return `<button onclick="S.orders.unshift(...S.orders.splice(S.orders.indexOf(S.orders.find(x=>x.id==='${o.id}')),1));go('done')" class="text-left bg-surface-container-low rounded-xl p-4 border border-primary/10 flex items-center gap-3"><span class="w-10 h-10 rounded-lg bg-surface-container-high flex items-center justify-center">${ic(s[3],"text-primary")}</span><div class="flex-1 min-w-0"><div class="text-[15px] font-bold">Pedido ${o.code} <span class="text-[11px] text-primary uppercase tracking-wider ml-1">${s[1]}</span></div><div class="text-[12px] text-on-surface-variant truncate">${esc(o.items)}</div></div><span class="font-anton text-[20px] text-primary">${fmt(o.total)}</span></button><button onclick="repeat('${o.id}')" class="-mt-1 mb-1 self-end text-[11px] font-bold uppercase tracking-wider text-primary flex items-center gap-1">${ic("replay","text-[16px]")}Repetir pedido</button>`}).join(""):`<div class="bg-surface-container-low rounded-xl p-5 text-center text-on-surface-variant text-[14px]">Todavía no hiciste pedidos. Tu primer festín te espera.</div>`}
 <a href="https://wa.me/${CFG.phone}" target="_blank" class="mt-2 border-[1.5px] border-wa rounded-xl py-3.5 flex items-center justify-center gap-2 text-[14px] font-bold uppercase tracking-wider">${ic("chat","text-wa")}Hablar con Bog's · ${esc(CFG.phoneShow)}</a></main>`+nav("account")}

/* ---------- actions ---------- */
const V={home,detail,cart,delivery,payment,done,search,account};
function render(){const app=document.getElementById("app");const m=app.querySelector("main"),top=m?m.scrollTop:0,same=app.dataset.v===S.view;app.innerHTML=`<div class="scr" ${same?'style="animation:none"':""}>${V[S.view]()}</div>`;app.dataset.v=S.view;if(same){const n=app.querySelector("main");if(n)n.scrollTop=top}}
function renderKeep(id){const el=document.getElementById(id),pos=el.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos)}}
function go(v){if(v==="cart"||v==="account")loadClub();if(v==="delivery"&&!cnt())return toast("Tu pedido está vacío");if(v==="done"&&!S.orders.length)v="home";S.view=v;render();watchOrders()}
function toPay(){if(!S.user.name.trim())return toast("Decinos tu nombre");if(S.user.phone.replace(/\D/g,"").length<8)return toast("Necesitamos tu WhatsApp");if(S.mode==="delivery"&&!S.user.addr.trim())return toast("Falta la dirección");saveLocal();go("payment")}
function openDet(id,from){if(!byId(id))return;S.det={pid:id,q:1,opts:[],from:from||S.view};go("detail")}
function togOpt(i){const a=S.det.opts;a.includes(i)?a.splice(a.indexOf(i),1):a.push(i);render()}
function detQ(d){S.det.q=Math.max(1,S.det.q+d);render()}
function addDet(){const d=S.det,p=byId(d.pid);if(p.available===false)return toast("Agotado por hoy");const key=JSON.stringify([d.pid,[...d.opts].sort()]);const ex=S.cart.find(l=>JSON.stringify([l.pid,[...l.opts].sort()])===key);ex?ex.q+=d.q:S.cart.push({pid:d.pid,q:d.q,opts:[...d.opts]});toast(p.n+" agregado");go(d.from==="cart"?"cart":"home")}
function quickAdd(id,btn){const ex=S.cart.find(l=>l.pid===id&&!l.opts.length);ex?ex.q++:S.cart.push({pid:id,q:1,opts:[]});const i=btn.querySelector(".msy");i.textContent="check";toast(byId(id).n+" agregado");setTimeout(render,600)}
function qty(i,d){S.cart[i].q+=d;if(S.cart[i].q<1)S.cart.splice(i,1);render()}
function rm(i){S.cart.splice(i,1);render()}
function favT(id){S.fav.has(id)?S.fav.delete(id):S.fav.add(id);render()}
function share(id){const u=location.origin+location.pathname+"#"+id;if(navigator.share)navigator.share({title:byId(id).n,url:u}).catch(()=>{});else{navigator.clipboard?.writeText(u);toast("Link copiado")}}
const payName={mp:"Mercado Pago",transfer:"Transferencia",cash:"Efectivo"};
function confirmOrder(){if(!OPEN())return toast("La cocina está cerrada");if(!S.cart.length)return go("home");const u=S.user;
 const code="B-"+Date.now().toString(36).slice(-4).toUpperCase()+Math.random().toString(36).slice(2,4).toUpperCase();
 const ref=db?db.collection("orders").doc():null,id=ref?ref.id:code;
 const items=S.cart.map(l=>{const p=byId(l.pid);return {pid:l.pid,name:p.n,q:l.q,unit:unit(l),opts:l.opts.map(k=>(optsOf(p)[k]||["?"])[0]),total:unit(l)*l.q}});
 const msg=[`*Pedido ${code} · ${u.name}*`,"",...items.map(i=>`• ${i.q}x ${i.name}${i.opts.length?" ("+i.opts.join(", ")+")":""} · ${fmt(i.total)}`),"",S.mode==="delivery"?`Delivery: ${u.addr}${u.floor?", "+u.floor:""}, ${u.city}`:`Retiro por sucursal (${CFG.pickup})`,`Tel: ${u.phone}`,`Pago: ${payName[S.pay]}${S.pay==="transfer"?" ("+CFG.transferOff+"% OFF)":""}`,S.note?`Aclaraciones: ${S.note}`:"",u.instr&&S.mode==="delivery"?`Repartidor: ${u.instr}`:"",cDisc()?`Cupón ${S.coupon.code}: -${fmt(cDisc())}`:"",kDisc()?`Club Bog's: -${fmt(kDisc())}`:"",`Envío: ${ship()?fmt(ship()):"gratis"}`,`*Total: ${fmt(total())}*`].filter(Boolean).join("\n");
 const wa="https://wa.me/"+CFG.phone+"?text="+encodeURIComponent(msg);if(!E2E)window.open(wa,"_blank");
 const order={code,status:"nuevo",items,subtotal:sub(),ship:ship(),discount:disc(),discounts:{transfer:tDisc(),coupon:cDisc(),club:kDisc()},coupon:cDisc()?S.coupon.code:"",clubReward:!!kDisc(),total:total(),mode:S.mode,pay:S.pay,note:S.note||"",customer:{name:u.name,phone:u.phone,addr:S.mode==="delivery"?u.addr:"",city:u.city,floor:u.floor||"",instr:u.instr||""}};
 if(ref&&!E2E)ref.set({...order,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>{console.warn(e);toast("No se pudo registrar, pero WhatsApp salió")});
 if(db&&cDisc()&&!E2E)db.collection("coupons").doc(S.coupon.code).update({uses:firebase.firestore.FieldValue.increment(1)}).catch(()=>{});S.coupon=null;S.clubReward=false;
 S.orders.unshift({id,code,total:total(),pay:S.pay,mode:S.mode,addr:u.addr,wa,status:"nuevo",items:items.map(i=>i.q+"× "+i.name).join(", "),t:Date.now()});saveLocal();
 S.cart=[];S.note="";S.sumOpen=false;go("done")}
async function repeat(id){if(!db)return;let d=S.live[id];if(!d){try{const s=await db.collection("orders").doc(id).get();d=s.data()}catch(e){}}if(!d)return toast("No pude recuperar ese pedido");let n=0;(d.items||[]).forEach(i=>{const p=byId(i.pid);if(!p||p.available===false)return;const o=optsOf(p);const opts=(i.opts||[]).map(nm=>o.findIndex(x=>x[0]===nm)).filter(k=>k>=0);S.cart.push({pid:p.id,q:i.q,opts});n++});if(!n)return toast("Esos productos ya no están");toast(n+" producto"+(n>1?"s":"")+" al pedido");go("cart")}
function watchOrders(){if(unsubOrder){unsubOrder();unsubOrder=null}if(!db)return;const o=S.orders[0];if(S.view==="done"&&o){unsubOrder=db.collection("orders").doc(o.id).onSnapshot(s=>{if(s.exists){S.live[o.id]=s.data();render()}},()=>{})}
 if(S.view==="account")S.orders.slice(0,5).forEach(o=>{if(!S.live[o.id])db.collection("orders").doc(o.id).get().then(s=>{if(s.exists){S.live[o.id]=s.data();if(S.view==="account")render()}}).catch(()=>{})})}
function promoBox(){const out=[];if(FE().coupons)out.push(S.coupon?`<div class="bg-surface-container-low rounded-xl p-3.5 flex items-center gap-3 border border-primary/40">${ic("confirmation_number","f text-primary")}<div class="flex-1 text-[14px]"><b>${esc(S.coupon.code)}</b> aplicado<div class="text-[12px] text-on-surface-variant">${esc(S.coupon.desc||"")}</div></div><button onclick="S.coupon=null;render()" class="text-outline">${ic("close")}</button></div>`
 :`<div class="flex gap-2"><div class="flex-1 flex items-center gap-2 bg-surface-container-low border border-white/10 rounded-xl px-3">${ic("confirmation_number","text-primary text-[20px]")}<input id="cup" placeholder="¿Tenés un cupón?" class="flex-1 bg-transparent py-3 text-[15px] uppercase placeholder:normal-case placeholder:text-outline" onkeydown="if(event.key==='Enter')applyCoupon()"></div><button onclick="applyCoupon()" class="bg-surface-container-high text-primary px-4 rounded-xl text-[12px] font-bold uppercase tracking-wider">Aplicar</button></div>`);
 if(FE().club)out.push(clubCard());return out.join("")}
function clubCard(){if(!FE().club)return "";const n=CFG.club?.every||5,pct=CFG.club?.rewardPct||0,c=S.club;if(!c)return `<div class="bg-surface-container-low rounded-xl p-3.5 flex items-center gap-3 border border-primary/10">${ic("workspace_premium","text-primary")}<div class="text-[13px]"><b>Club Bog's</b>: cada ${n} pedidos, el siguiente con ${pct}% OFF. ${S.user.phone?"Se activa con tu primer pedido.":"Cargá tu WhatsApp para sumar."}</div></div>`;
 const k=c.count||0,ready=k>=n;return `<div class="rounded-xl p-3.5 border ${ready?"border-primary gold-bar text-on-primary":"border-primary/10 bg-surface-container-low"}"><div class="flex items-center gap-3">${ic("workspace_premium",ready?"f":"text-primary")}<div class="flex-1 text-[13px]">${ready?`<b>¡Recompensa lista!</b> ${pct}% OFF en este pedido.`:`<b>Club Bog's</b> · llevás ${k} de ${n} pedidos. ${n-k===1?"¡El próximo te da":"Te faltan "+(n-k)+" para"} ${pct}% OFF.`}</div></div>${ready?"":`<div class="h-1.5 bg-surface-container-high rounded-full mt-2 overflow-hidden"><div class="h-full gold-bar rounded-full" style="width:${Math.round(k/n*100)}%"></div></div>`}</div>`}
const phoneKey=()=>{let d=S.user.phone.replace(/\D/g,"");if(d.startsWith("54"))d=d.slice(2);if(d.startsWith("9"))d=d.slice(1);d=d.replace(/^0/,"");return d.length>=8?d:""};
function loadClub(){if(!db||!FE().club)return;const k=phoneKey();if(!k){S.club=null;S.clubReward=false;return}if(S.club&&S.club.key===k)return;db.collection("club").doc(k).get().then(s=>{S.club={key:k,...(s.exists?s.data():{count:0})};S.clubReward=(S.club.count||0)>=(CFG.club?.every||5);render()}).catch(()=>{})}
async function applyCoupon(){const code=(document.getElementById("cup")?.value||"").trim().toUpperCase();if(!code||!db)return;try{const s=await db.collection("coupons").doc(code).get();const c=s.exists?s.data():null;
 if(!c||c.active===false)return toast("Cupón inválido");if(c.expires&&new Date(c.expires+"T23:59:59")<new Date())return toast("Ese cupón venció");if(c.maxUses&&(c.uses||0)>=c.maxUses)return toast("Ese cupón se agotó");if(sub()<(c.minSubtotal||0))return toast("Mínimo "+fmt(c.minSubtotal)+" para usarlo");
 S.coupon={code,type:c.type,value:c.value||0,minSubtotal:c.minSubtotal||0,desc:c.type==="percent"?c.value+"% de descuento":c.type==="fixed"?fmt(c.value)+" de descuento":"Envío gratis"};toast("Cupón aplicado");render()}catch(e){toast("No pude validar el cupón")}}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1500)}
render();
setInterval(()=>{if(S.view==="home")render()},60000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(location.hash.length>1){const id=location.hash.slice(1);setTimeout(()=>{if(byId(id))openDet(id)},600)}
</script>
</body></html>
