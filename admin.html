<script src="https://cdn.tailwindcss.com"></script>

<style>
body{background:#141311;color:#e7e2dd;font-family:'Space Grotesk',system-ui,sans-serif}
.msy{font-family:'Material Symbols Outlined';font-size:22px;line-height:1;display:inline-block;font-variation-settings:'FILL' 0,'wght' 400;vertical-align:middle}

.btn-p{background:linear-gradient(90deg,#ffcc72,#e9ae3b);color:#422c00}.btn-g{background:#2b2a27;color:#ffcc72}.btn-r{background:#93000a;color:#ffdad6}

<body>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="data.js?v=1788590483"></script>
<div id="root" class="min-h-screen"></div>
<script>
const D=window.BOGS_DEFAULTS,ST=D.statuses,CATS=D.cats;
firebase.initializeApp(D.fb);const auth=firebase.auth(),db=firebase.firestore(),TS=firebase.firestore.FieldValue.serverTimestamp;
const $=s=>document.querySelector(s),fmt=n=>"$"+Math.round(n||0).toLocaleString("es-AR"),ic=(n,c="")=>`<span class="msy ${c}">${n}</span>`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let A={user:null,tab:"pedidos",orders:[],menu:[],cfg:{...D.settings},admins:[],err:"",filter:"activos",unsubs:[],seen:null,loaded:false};
const payName={mp:"Mercado Pago",transfer:"Transferencia",cash:"Efectivo"};
const stName=k=>(ST.find(s=>s[0]===k)||ST[0])[1];
const ago=t=>{if(!t)return "…";const m=Math.round((Date.now()-t.toMillis())/60000);return m<1?"ahora":m<60?m+" min":Math.floor(m/60)+" h "+(m%60)+" min"};
const hhmm=t=>t?t.toDate().toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}):"";
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.6);o.start();o.stop(c.currentTime+.6)}catch(e){}}

/* ---------- auth ---------- */
auth.onAuthStateChanged(u=>{A.user=u;A.unsubs.forEach(f=>f());A.unsubs=[];if(u&&!u.emailVerified){u.sendEmailVerification().catch(()=>{})}else if(u)subscribe();render()});
async function login(){A.err="";const e=$("#email").value.trim(),p=$("#pass").value;try{await auth.signInWithEmailAndPassword(e,p)}catch(x){A.err={"auth/operation-not-allowed":"El proveedor Email/Contraseña no está habilitado en Firebase Authentication.","auth/invalid-credential":"Email o contraseña incorrectos.","auth/user-not-found":"Ese usuario no existe. Crealo en Firebase Authentication.","auth/wrong-password":"Contraseña incorrecta.","auth/too-many-requests":"Demasiados intentos. Esperá unos minutos."}[x.code]||x.message;render()}}
async function reset(){const e=$("#email").value.trim();if(!e){A.err="Escribí tu email primero.";return render()}try{await auth.sendPasswordResetEmail(e);A.err="Te mandamos un mail para restablecer la contraseña."}catch(x){A.err=x.message}render()}
function subscribe(){
 A.unsubs.push(db.collection("orders").orderBy("createdAt","desc").limit(150).onSnapshot(s=>{const prev=A.seen;A.orders=s.docs.map(d=>({id:d.id,...d.data()}));const nuevos=A.orders.filter(o=>o.status==="nuevo").length;if(prev!==null&&nuevos>prev){beep();notify(A.orders.find(o=>o.status==="nuevo"))}A.seen=nuevos;document.title=(nuevos?`(${nuevos}) `:"")+"BOG'S · Panel";A.loaded=true;render()},e=>{A.err=e.code==="permission-denied"?"Tu usuario no es administrador. Pedile a un admin que agregue tu email.":e.message;render()}));
 A.unsubs.push(db.collection("orders").where("createdAt",">=",new Date(Date.now()-30*864e5)).orderBy("createdAt","desc").onSnapshot(s=>{A.sales=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{}));
 A.unsubs.push(db.collection("menu").orderBy("order").onSnapshot(s=>{A.menu=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
 A.unsubs.push(db.collection("settings").doc("store").onSnapshot(s=>{if(s.exists)A.cfg={...D.settings,...s.data()};render()}));
 A.unsubs.push(db.collection("coupons").onSnapshot(s=>{A.coupons=s.docs.map(d=>({code:d.id,...d.data()}));render()},()=>{}));
 A.unsubs.push(db.collection("admins").onSnapshot(s=>{A.admins=s.docs.map(d=>d.id);render()},()=>{}));}

/* ---------- views ---------- */
function loginView(){return `<div class="min-h-screen flex items-center justify-center p-6"><div class="card w-full max-w-sm p-7"><img src="img/logo.jpg" class="h-12 mx-auto rounded" alt="BOG'S"><h1 class="font-anton text-2xl uppercase text-center mt-4">Panel del local</h1><p class="text-muted text-sm text-center mt-1">Pedidos, menú y configuración</p>
 <div class="mt-6 flex flex-col gap-3"><input id="email" type="email" placeholder="Email" autocomplete="username"><input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn btn-p justify-center" onclick="login()">Entrar</button><button class="text-xs text-outline underline" onclick="reset()">Olvidé mi contraseña</button></div>
 ${A.err?`<p class="mt-4 text-sm text-on-red bg-red/40 border border-red rounded-lg p-3">${esc(A.err)}</p>`:""}</div></div>`}
function shell(inner){const nuevos=A.orders.filter(o=>o.status==="nuevo").length;const tabs=[["pedidos","receipt_long","Pedidos"],["ventas","insights","Ventas"],["promos","sell","Promos"],["menu","restaurant_menu","Menú"],["local","storefront","Local"],["admins","admin_panel_settings","Admins"]];
 return `<header class="sticky top-0 z-20 bg-surface/90 backdrop-blur border-b border-white/5"><div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-4"><img src="img/logo.jpg" class="h-8 rounded" alt="BOG'S"><span class="font-anton text-lg uppercase hidden sm:inline">Panel</span>
 <nav class="flex gap-1 ml-2 overflow-x-auto">${tabs.map(([k,i,l])=>`<button onclick="A.tab='${k}';render()" class="tab flex items-center gap-1.5 px-3 h-16 border-b-2 border-transparent text-sm font-semibold uppercase tracking-wider text-muted ${A.tab===k?"on":""}">${ic(i,"text-[20px]")}<span class="hidden sm:inline">${l}</span>${k==="pedidos"&&nuevos?`<span class="bg-gold text-on-primary text-[11px] font-bold rounded-full px-1.5">${nuevos}</span>`:""}</button>`).join("")}</nav>
 <div class="ml-auto flex items-center gap-3"><select onchange="db.collection('settings').doc('store').set({eta:this.value},{merge:true}).catch(fail)" title="Demora estimada" class="!w-auto !py-2 text-xs font-bold uppercase tracking-wider">${["25–35 min","35–50 min","45–60 min","60–75 min","75–90 min","90–120 min"].map(e=>`<option ${A.cfg.eta===e?"selected":""}>${e}</option>`).join("")}${["25–35 min","35–50 min","45–60 min","60–75 min","75–90 min","90–120 min"].includes(A.cfg.eta)?"":`<option selected>${esc(A.cfg.eta)}</option>`}</select><button onclick="toggleOpen()" class="btn ${A.cfg.open?"btn-g":"btn-r"}">${ic(A.cfg.open?"local_fire_department":"bedtime","text-[18px]")}${A.cfg.open?"Cocina abierta":"Cerrado"}</button>${("Notification" in window)&&Notification.permission!=="granted"?`<button onclick="Notification.requestPermission().then(render)" class="btn btn-g" title="Activar avisos de escritorio">${ic("notifications_active","text-[18px]")}<span class="hidden lg:inline">Avisos</span></button>`:""}<span class="text-xs text-outline hidden md:inline">${esc(A.user.email)}</span><button onclick="auth.signOut()" title="Salir" class="text-outline">${ic("logout")}</button></div></div></header>
 <main class="max-w-6xl mx-auto p-4">${A.err?`<p class="mb-4 text-sm text-on-red bg-red/40 border border-red rounded-lg p-3">${esc(A.err)}</p>`:""}${inner}</main>`}

function priceCheck(o){if(!A.menu.length)return null;const opts=D.opts;let exp=0;for(const i of (o.items||[])){const p=A.menu.find(m=>m.id===i.pid);if(!p)return "Producto desconocido: "+i.name;const o2=Array.isArray(p.extras)&&p.extras.length?p.extras:(p.o&&opts[p.o]?opts[p.o]:[]);const ex=(i.opts||[]).reduce((a,n)=>{const f=o2.find(x=>x[0]===n);return a+(f?f[2]:0)},0);if(Math.abs((p.p+ex)-i.unit)>1)return `${i.name}: cobrado ${fmt(i.unit)}, menú ${fmt(p.p+ex)}`;exp+=i.unit*i.q}
 if(Math.abs(exp-(o.subtotal||0))>1)return "Subtotal no coincide con los ítems";const zc=(A.cfg.zones||[]).map(z=>z.cost);if(o.mode==="delivery"&&o.ship!==0&&!zc.includes(o.ship))return "Envío inusual: "+fmt(o.ship);if(o.mode==="retiro"&&o.ship)return "Retiro con envío cobrado";
 const c=(A.coupons||[]).find(x=>x.code===o.coupon);let max=(o.pay==="transfer"?o.subtotal*(A.cfg.transferOff||0)/100:0)+(c?(c.type==="percent"?o.subtotal*c.value/100:c.type==="fixed"?c.value:0):0)+(o.clubReward&&(A.cfg.features||{}).club?o.subtotal*(A.cfg.club?.rewardPct||0)/100:0);if((o.discount||0)>max+1)return "Descuento mayor al permitido: "+fmt(o.discount);if(Math.abs((o.subtotal-o.discount+o.ship)-o.total)>1)return "Total no cierra";return null}
function orderCard(o){const st=o.status,next={nuevo:["cocina","A la plancha","skillet"],cocina:[o.mode==="delivery"?"camino":"listo",o.mode==="delivery"?"Salió en camino":"Listo para retirar","moped"],camino:["entregado","Entregado","celebration"],listo:["entregado","Entregado","celebration"]}[st];
 const tel=(o.customer?.phone||"").replace(/\D/g,""),wa=tel?"https://wa.me/"+(tel.startsWith("54")?tel:"549"+tel.replace(/^0/,"").replace(/^15/,"")):"";
 return `<div class="card p-4 flex flex-col gap-3 ${st==="nuevo"?"new border-gold/60":""}"><div class="flex items-start justify-between gap-2"><div><div class="font-anton text-2xl">${esc(o.code)} <span class="text-sm font-grot text-outline font-normal">${hhmm(o.createdAt)} · hace ${ago(o.createdAt)}</span></div><div class="text-sm font-semibold mt-0.5">${esc(o.customer?.name)} ${wa?`<a href="${wa}" target="_blank" class="text-wa ml-1">${ic("chat","text-[18px]")} ${esc(o.customer.phone)}</a>`:""}</div></div>${o.coupon?`<span class="text-[10px] font-bold uppercase bg-surface-high text-primary px-1.5 py-0.5 rounded mr-1">Cupón ${esc(o.coupon)}</span>`:""}${o.clubReward?`<span class="text-[10px] font-bold uppercase bg-surface-high text-primary px-1.5 py-0.5 rounded mr-1">Club</span>`:""}<span class="text-[11px] font-bold uppercase tracking-wider px-2 py-1 rounded ${st==="nuevo"?"bg-gold text-on-primary":st==="cancelado"?"bg-red text-on-red":"bg-surface-high text-primary"}">${stName(st)}</span></div>${(()=>{const w=priceCheck(o);return w?`<div class="text-sm bg-red/50 border border-red rounded-lg p-2.5 flex gap-2 items-start">${ic("gpp_maybe","text-on-red text-[20px]")}<span><b>Revisar antes de cobrar:</b> ${esc(w)}. El cliente pudo haber alterado el pedido.</span></div>`:""})()}
 <div class="text-sm flex flex-col gap-1">${(o.items||[]).map(i=>`<div class="flex justify-between gap-2"><span><b>${i.q}×</b> ${esc(i.name)}${i.opts?.length?`<span class="text-primary"> · ${esc(i.opts.join(", "))}</span>`:""}</span><span class="text-muted">${fmt(i.total)}</span></div>`).join("")}</div>
 ${o.note?`<div class="text-sm bg-surface-c rounded-lg p-2.5 flex gap-2">${ic("edit_note","text-primary text-[18px]")}<span>${esc(o.note)}</span></div>`:""}
 <div class="text-sm text-muted flex flex-wrap gap-x-4 gap-y-1"><span>${ic(o.mode==="delivery"?"moped":"storefront","text-[18px] text-primary")} ${o.mode==="delivery"?esc([o.customer?.addr,o.customer?.floor,o.customer?.city].filter(Boolean).join(", ")):"Retiro en local"}</span><span>${ic("payments","text-[18px] text-primary")} ${payName[o.pay]||o.pay}${o.discount?" (−"+fmt(o.discount)+")":""}</span>${o.customer?.instr?`<span>${ic("sms","text-[18px] text-primary")} ${esc(o.customer.instr)}</span>`:""}</div>
 <div class="flex items-center justify-between gap-2 pt-2 border-t border-white/5"><span class="font-anton text-2xl text-primary">${fmt(o.total)}</span><div class="flex gap-2 flex-wrap justify-end"><button onclick="printTicket('${o.id}')" class="btn btn-g" title="Imprimir comanda">${ic("print","text-[18px]")}</button>${wa&&st!=="cancelado"&&st!=="nuevo"?`<a href="${wa}?text=${encodeURIComponent(aviso(o))}" target="_blank" class="btn btn-g" title="Avisar al cliente por WhatsApp">${ic("chat","text-[18px] text-wa")}Avisar</a>`:""}${st!=="cancelado"&&st!=="entregado"?`<button onclick="setStatus('${o.id}','cancelado')" class="btn btn-g">${ic("close","text-[18px]")}</button>`:""}${next?`<button onclick="setStatus('${o.id}','${next[0]}')" class="btn btn-p">${ic(next[2],"text-[18px]")}${next[1]}</button>`:`<button onclick="setStatus('${o.id}','nuevo')" class="btn btn-g">Reabrir</button>`}</div></div></div>`}
function pedidos(){const act=A.orders.filter(o=>!["entregado","cancelado"].includes(o.status)),hist=A.orders.filter(o=>["entregado","cancelado"].includes(o.status));const list=A.filter==="activos"?act:hist;
 const cols=[["nuevo","Nuevos"],["cocina","En cocina"],["camino","En camino / Listo"]];const today=A.orders.filter(o=>o.status==="entregado"&&o.createdAt&&o.createdAt.toDate().toDateString()===new Date().toDateString());
 return `<div class="flex flex-wrap items-center gap-3 mb-4"><h2 class="font-anton text-3xl uppercase">Pedidos</h2><div class="flex bg-surface-c rounded-lg p-1 text-sm font-semibold">${["activos","historial"].map(f=>`<button onclick="A.filter='${f}';render()" class="px-3 py-1.5 rounded-md uppercase tracking-wider text-xs ${A.filter===f?"bg-gold text-on-primary":"text-muted"}">${f}</button>`).join("")}</div><span class="ml-auto text-sm text-muted">Hoy: <b class="text-on-surface">${today.length}</b> entregados · <b class="text-primary">${fmt(today.reduce((a,o)=>a+(o.total||0),0))}</b></span></div>
 ${!A.loaded?`<p class="text-muted">Cargando…</p>`:A.filter==="activos"?(act.length?`<div class="grid md:grid-cols-3 gap-4">${cols.map(([k,t])=>{const its=act.filter(o=>k==="camino"?["camino","listo"].includes(o.status):o.status===k);return `<div><div class="text-xs font-bold uppercase tracking-wider text-muted mb-2">${t} · ${its.length}</div><div class="flex flex-col gap-3">${its.map(orderCard).join("")||`<div class="card p-6 text-center text-outline text-sm">Nada por acá</div>`}</div></div>`}).join("")}</div>`:`<div class="card p-10 text-center text-muted">${ic("skillet","text-[48px] text-outline")}<p class="mt-2">Sin pedidos activos. Cuando entre uno, suena y aparece acá.</p></div>`):`<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">${hist.map(orderCard).join("")||`<div class="card p-6 text-center text-outline">Sin historial</div>`}</div>`}`}

function menuView(){if(!A.menu.length)return `<div class="card p-10 text-center"><h2 class="font-anton text-3xl uppercase">Menú vacío</h2><p class="text-muted mt-2">La app está mostrando el menú por defecto. Cargalo en la base para poder editarlo desde acá.</p><button onclick="seedMenu()" class="btn btn-p mt-5">${ic("download","text-[18px]")}Cargar menú inicial (${D.menu.length} productos)</button></div>`;
 const stOf=p=>p.hidden?"oculto":p.available===false?"agotado":"disponible";
 return `<div class="flex items-center gap-3 mb-4 flex-wrap"><h2 class="font-anton text-3xl uppercase">Menú</h2><span class="text-sm text-muted">${A.menu.length} productos · ${A.menu.filter(p=>stOf(p)==="disponible").length} publicados · los cambios impactan al instante</span><button onclick="addProduct()" class="btn btn-p ml-auto">${ic("add","text-[18px]")}Producto</button></div>
 <div class="flex flex-col gap-2">${A.menu.map((p,i)=>{const st=stOf(p);return `<div class="card overflow-hidden ${st==="oculto"?"opacity-50":st==="agotado"?"opacity-75":""}"><div class="p-3 grid grid-cols-[56px_1fr_auto] md:grid-cols-[56px_1fr_150px_150px_auto] gap-3 items-center">
 <div class="w-14 h-14 rounded-lg overflow-hidden bg-surface-c flex items-center justify-center cursor-pointer" onclick="editP('${p.id}')">${p.imgData||p.img?`<img src="${p.imgData||"img/"+esc(p.img)}" class="w-full h-full object-cover" onerror="this.style.display='none'">`:ic(p.ic||"restaurant","text-primary text-[26px]")}</div>
 <div class="min-w-0"><div class="font-anton text-lg uppercase truncate">${esc(p.n)} ${p.featured?ic("star","f text-primary text-[16px]"):""}</div><div class="text-xs text-muted truncate">${CATS[p.cat]||"—"} · ${fmt(p.p)}${p.oldPrice>p.p?` <s>${fmt(p.oldPrice)}</s>`:""}${p.freeShip?" · envío gratis":""}${(p.extras||[]).length?` · ${p.extras.length} extras`:""}</div></div>
 <select onchange="setState('${p.id}',this.value)" class="hidden md:block ${st==="disponible"?"!border-emerald-500/50 text-emerald-300":st==="agotado"?"!border-gold/50 text-primary":"text-muted"}"><option value="disponible" ${st==="disponible"?"selected":""}>Publicado</option><option value="agotado" ${st==="agotado"?"selected":""}>Agotado hoy</option><option value="oculto" ${st==="oculto"?"selected":""}>Oculto</option></select>
 <button onclick="editP('${p.id}')" class="btn btn-g justify-center hidden md:flex">${ic("edit","text-[16px]")}Editar ficha</button>
 <div class="flex gap-1 justify-end"><button onclick="editP('${p.id}')" class="md:hidden text-primary">${ic("edit")}</button><button onclick="move(${i},-1)" class="text-outline">${ic("arrow_upward")}</button><button onclick="move(${i},1)" class="text-outline">${ic("arrow_downward")}</button><button onclick="delProduct('${p.id}','${esc(p.n)}')" class="text-red">${ic("delete")}</button></div></div>
 <div class="md:hidden px-3 pb-3"><select onchange="setState('${p.id}',this.value)"><option value="disponible" ${st==="disponible"?"selected":""}>Publicado</option><option value="agotado" ${st==="agotado"?"selected":""}>Agotado hoy</option><option value="oculto" ${st==="oculto"?"selected":""}>Oculto</option></select></div>
 ${A.edit===p.id?editView(p):""}</div>`}).join("")}</div>
 <p class="text-xs text-outline mt-4">Publicado: visible y se puede pedir. Agotado hoy: visible pero sin botón de agregar. Oculto: no aparece en la app, conserva ficha y foto.</p>`}
const ICONS=["lunch_dining","bakery_dining","local_pizza","fastfood","local_drink","sports_bar","water_drop","timer","local_fire_department","outdoor_grill","grain","group","ac_unit","layers","egg","set_meal","restaurant","kebab_dining","icecream","eco","do_not_disturb_on","star","bolt","scale","donut_large","circle","cookie","nutrition"];
function editP(id){if(A.edit===id){A.edit=null;A.draft=null;return render()}const p=A.menu.find(x=>x.id===id);A.edit=id;A.draft=JSON.parse(JSON.stringify({n:p.n,cat:p.cat||1,p:p.p||0,oldPrice:p.oldPrice||"",d:p.d||"",long:p.long||"",slogan:p.slogan||"",tag:p.tag||"",fav:!!p.fav,rating:p.rating||"",featured:!!p.featured,freeShip:!!p.freeShip,pz:!!p.pz,specs:(p.specs&&p.specs.length?p.specs:[["lunch_dining","",""],["bakery_dining","",""],["timer","",""]]),extras:(p.extras&&p.extras.length?p.extras:((p.o&&D.opts[p.o])||[])).map(x=>[...x])}));render();setTimeout(()=>document.getElementById("edit-"+id)?.scrollIntoView({behavior:"smooth",block:"start"}),50)}

 const iconSel=(v,on)=>`<select onchange="${on}" class="!w-[64px] !px-1" title="Ícono">${ICONS.map(i=>`<option value="${i}" ${i===v?"selected":""}>${i}</option>`).join("")}</select>`;

function upImg(id,inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const M=640,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);let q=.78,d=c.toDataURL("image/jpeg",q);while(d.length>600000&&q>.4){q-=.1;d=c.toDataURL("image/jpeg",q)}db.collection("menu").doc(id).update({imgData:d}).catch(fail)};im.src=r.result};r.readAsDataURL(f)}

 const days=[];s.forEach(o=>{const k=o.createdAt.toDate().toLocaleDateString("es-AR",{weekday:"short",day:"2-digit",month:"2-digit"});let d=days.find(x=>x.k===k);if(!d){d={k,n:0,t:0};days.push(d)}d.n++;d.t+=o.total});const maxT=Math.max(...days.map(d=>d.t));
 const prods={};s.forEach(o=>(o.items||[]).forEach(i=>{prods[i.name]=prods[i.name]||{q:0,t:0};prods[i.name].q+=i.q;prods[i.name].t+=i.total}));const top=Object.entries(prods).sort((a,b)=>b[1].q-a[1].q).slice(0,8),maxQ=top[0]?.[1].q||1;
 const share=(k,names)=>{const m={};s.forEach(o=>{m[o[k]]=(m[o[k]]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([a,n])=>`<div class="flex justify-between text-sm py-1.5 border-b border-white/5"><span>${names[a]||a}</span><span class="text-muted">${n} · ${Math.round(n/s.length*100)}%</span></div>`).join("")};
 const kpi=(l,v,sub)=>`<div class="card p-4"><div class="text-xs font-bold uppercase tracking-wider text-muted">${l}</div><div class="font-anton text-3xl text-primary mt-1">${v}</div>${sub?`<div class="text-xs text-outline">${sub}</div>`:""}</div>`;
 return `<div class="flex items-center gap-3"><h2 class="font-anton text-3xl uppercase mb-1">Ventas</h2><button onclick="exportCSV()" class="btn btn-g ml-auto">${ic("download","text-[18px]")}Exportar CSV</button></div><p class="text-sm text-muted mb-4">Últimos 30 días · solo pedidos entregados${canc?` · ${canc} cancelados`:""}</p>
 <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-4">${kpi("Facturado",fmt(tot),s.length+" pedidos")}${kpi("Hoy",fmt(hoy.reduce((a,o)=>a+o.total,0)),hoy.length+" pedidos")}${kpi("Ticket promedio",fmt(tot/s.length))}${kpi("Envíos cobrados",fmt(s.reduce((a,o)=>a+(o.ship||0),0)),Math.round(s.filter(o=>o.mode==="delivery").length/s.length*100)+"% delivery")}</div>
 <div class="grid lg:grid-cols-3 gap-4"><div class="card p-4 lg:col-span-2"><div class="font-bold uppercase text-sm tracking-wider mb-3">Por día</div>${days.map(d=>`<div class="grid grid-cols-[90px_1fr_90px] items-center gap-3 text-sm py-1"><span class="text-muted capitalize">${d.k}</span><div class="h-5 bg-surface-c rounded"><div class="h-full rounded bg-gradient-to-r from-gold to-primary" style="width:${Math.max(3,Math.round(d.t/maxT*100))}%"></div></div><span class="text-right font-semibold">${fmt(d.t)} <span class="text-outline text-xs">${d.n}</span></span></div>`).join("")}</div>
 <div class="flex flex-col gap-4"><div class="card p-4"><div class="font-bold uppercase text-sm tracking-wider mb-3">Más vendidos</div>${top.map(([n,v])=>`<div class="text-sm py-1"><div class="flex justify-between"><span class="truncate">${esc(n)}</span><span class="text-muted shrink-0 ml-2">${v.q} u · ${fmt(v.t)}</span></div><div class="h-1.5 bg-surface-c rounded mt-1"><div class="h-full rounded bg-primary" style="width:${Math.round(v.q/maxQ*100)}%"></div></div></div>`).join("")}</div>
 <div class="card p-4"><div class="font-bold uppercase text-sm tracking-wider mb-2">Medios de pago</div>${share("pay",payName)}<div class="font-bold uppercase text-sm tracking-wider mt-4 mb-2">Modalidad</div>${share("mode",{delivery:"Delivery",retiro:"Retiro"})}</div></div></div>`}
function aviso(o){const n=(o.customer?.name||"").split(" ")[0];const m={cocina:`Hola ${n}! Tu pedido ${o.code} ya está en la plancha 🔥 Te avisamos cuando salga.`,camino:`${n}, tu pedido ${o.code} salió en camino 🛵 Llega en aprox. ${A.cfg.eta}. Total: ${fmt(o.total)}${o.pay==="cash"?" en efectivo":""}.`,listo:`${n}, tu pedido ${o.code} está listo para retirar en ${A.cfg.pickup} 🏪`,entregado:`Gracias por tu pedido ${o.code}, ${n}! Que lo disfrutes ⚡`};return m[o.status]||`Hola ${n}, te escribimos por tu pedido ${o.code}.`}
function printTicket(id){const o=A.orders.find(x=>x.id===id);if(!o)return;const w=window.open("","_blank","width=420,height=700");const li=(o.items||[]).map(i=>`<tr><td class="q">${i.q}x</td><td>${esc(i.name)}${i.opts?.length?`<div class="s">+ ${esc(i.opts.join(", "))}</div>`:""}</td><td class="r">${fmt(i.total)}</td></tr>`).join("");
 w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Comanda ${o.code}</title><style>@page{size:80mm auto;margin:4mm}body{font-family:ui-monospace,Menlo,monospace;font-size:12px;width:72mm;margin:0;color:#000}h1{font-size:22px;margin:0;text-align:center;letter-spacing:2px}.c{text-align:center}.b{font-weight:700}.big{font-size:18px}hr{border:0;border-top:1px dashed #000;margin:6px 0}table{width:100%;border-collapse:collapse}td{vertical-align:top;padding:2px 0}.q{width:28px;font-weight:700}.r{text-align:right;white-space:nowrap}.s{font-size:11px}.tot{font-size:16px;font-weight:700}.box{border:2px solid #000;padding:4px;text-align:center;font-weight:700;font-size:14px;margin:6px 0}</style></head><body onload="print()"><h1>BOG'S</h1><div class="c">La hamburguesa de los dioses</div><hr><div class="big b">${esc(o.code)} <span style="float:right">${hhmm(o.createdAt)}</span></div><div>${o.createdAt?o.createdAt.toDate().toLocaleDateString("es-AR"):""}</div><div class="box">${o.mode==="delivery"?"DELIVERY":"RETIRO EN LOCAL"}</div><div class="b">${esc(o.customer?.name)}</div><div>${esc(o.customer?.phone)}</div>${o.mode==="delivery"?`<div>${esc([o.customer?.addr,o.customer?.floor,o.customer?.city].filter(Boolean).join(", "))}</div>`:""}${o.customer?.instr?`<div class="s">Repartidor: ${esc(o.customer.instr)}</div>`:""}<hr><table>${li}</table>${o.note?`<hr><div class="b">ACLARACIONES:</div><div>${esc(o.note)}</div>`:""}<hr><table><tr><td>Subtotal</td><td class="r">${fmt(o.subtotal)}</td></tr><tr><td>Envío</td><td class="r">${o.ship?fmt(o.ship):"gratis"}</td></tr>${o.discount?`<tr><td>Descuento</td><td class="r">-${fmt(o.discount)}</td></tr>`:""}<tr class="tot"><td>TOTAL</td><td class="r">${fmt(o.total)}</td></tr></table><div class="box">${(payName[o.pay]||o.pay).toUpperCase()}${o.pay==="cash"?" · COBRAR":o.pay==="transfer"?" · VERIFICAR COMPROBANTE":""}</div><div class="c s">Hecha con pasión, servida para vos</div></body></html>`);w.document.close()}
function exportCSV(){const rows=[["fecha","hora","codigo","estado","cliente","telefono","modalidad","localidad","direccion","pago","items","subtotal","envio","descuento","total","nota"]];(A.sales||[]).forEach(o=>{const d=o.createdAt?o.createdAt.toDate():null;rows.push([d?d.toLocaleDateString("es-AR"):"",d?hhmm(o.createdAt):"",o.code,o.status,o.customer?.name,o.customer?.phone,o.mode,o.customer?.city,o.customer?.addr,payName[o.pay]||o.pay,(o.items||[]).map(i=>i.q+"x "+i.name+(i.opts?.length?" ("+i.opts.join(", ")+")":"")).join(" | "),o.subtotal,o.ship,o.discount,o.total,o.note])});const csv="\uFEFF"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="ventas-bogs-"+new Date().toISOString().slice(0,10)+".csv";a.click()}
render();
